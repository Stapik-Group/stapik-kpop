name: Package

on:
  push:
    branches-ignore:
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - name: Version of the packages
        id: version
        run: |
          project_version=$(sed -nE 's/^project\(stapikkpop VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "${GITHUB_REF_NAME#v}" != "$project_version" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match project version '$project_version' in CMakeLists.txt"
              exit 1
            fi
            version="$project_version"
          else
            version="${project_version}-${GITHUB_SHA::7}"
          fi

          echo "value=${version}" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PACKAGE_NAME: stapik-kpop-${{ needs.version.outputs.value }}-windows-x64
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtkmm-4.0
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-hicolor-icon-theme
            mingw-w64-ucrt-x86_64-librsvg

      - name: Tool versions
        run: |
          g++ --version | head -n 1
          cmake --version | head -n 1
          pkg-config --modversion gtk4 gtkmm-4.0
          curl-config --version --ssl-backends || true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTAPIK_KPOP_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Assemble the folder
        run: |
          cmake --build build --target stapikkpop_windows_bundle
          cp packaging/windows/README.txt build/stapikkpop-windows/README.txt
          mv build/stapikkpop-windows "build/${PACKAGE_NAME}"

      - name: Zip
        shell: pwsh
        run: |
          Set-Location build
          7z a -tzip "..\$env:PACKAGE_NAME.zip" "$env:PACKAGE_NAME" | Out-Null
          Set-Location ..
          $hash = (Get-FileHash "$env:PACKAGE_NAME.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:PACKAGE_NAME.zip" | Out-File -Encoding ascii "$env:PACKAGE_NAME.zip.sha256"
          Get-Item "$env:PACKAGE_NAME.zip" | Select-Object Name, @{ Name = 'MB'; Expression = { [math]::Round($_.Length / 1MB, 1) } }

      # What a tester does: unpack the zip somewhere clean and start the program, on a PC where only the Windows
      # directories are searched for DLLs. Data goes to a temporary folder so the run starts from scratch.
      - name: Smoke test the zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'smoke'
          $work = Join-Path $env:RUNNER_TEMP 'smoke-data'
          Remove-Item $target, $work -Recurse -Force -ErrorAction SilentlyContinue
          7z x "$env:PACKAGE_NAME.zip" "-o$target" -y | Out-Null
          $exe = Join-Path $target "$env:PACKAGE_NAME\stapikkpop.exe"
          if (-not (Test-Path $exe)) { throw "stapikkpop.exe is not in the zip" }

          foreach ($name in 'data', 'config', 'cache') { New-Item -ItemType Directory -Force (Join-Path $work $name) | Out-Null }
          $env:XDG_DATA_HOME = Join-Path $work 'data'
          $env:XDG_CONFIG_HOME = Join-Path $work 'config'
          $env:XDG_CACHE_HOME = Join-Path $work 'cache'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"

          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru
          $finished = $process.WaitForExit(90000)
          if (-not $finished) { $process.Kill() }

          $log = Join-Path $work 'cache\stapikkpop\stapik.log'
          Write-Host '---- stapik.log ----'
          if (Test-Path $log) { Get-Content $log } else { Write-Host '(no log file was written)' }
          Write-Host '--------------------'

          if (-not $finished) { throw 'the self-test did not finish within 90 seconds' }
          if ($process.ExitCode -ne 0) { throw "the self-test failed (exit code $($process.ExitCode))" }

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            ${{ env.PACKAGE_NAME }}.zip
            ${{ env.PACKAGE_NAME }}.zip.sha256

  deb:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtkmm-4.0-dev libcurl4-openssl-dev ninja-build dpkg-dev

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTAPIK_KPOP_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      # The default file name of CPack is stapikkpop-<version>-Linux.deb; DEB-DEFAULT gives the Debian one,
      # stapikkpop_<version>_amd64.deb.
      - name: Build the .deb
        run: |
          (cd build && cpack -G DEB -D CPACK_DEBIAN_FILE_NAME=DEB-DEFAULT)

          mkdir dist
          cp build/stapikkpop_*_amd64.deb dist/
          (cd dist && deb=$(ls stapikkpop_*_amd64.deb) && sha256sum "$deb" > "$deb.sha256")

          dpkg-deb --info dist/stapikkpop_*_amd64.deb
          dpkg-deb --contents dist/stapikkpop_*_amd64.deb

      - name: Smoke test in a clean Ubuntu 24.04
        run: |
          docker run --rm --volume "$PWD/dist:/dist:ro" ubuntu:24.04 bash -euxc '
            apt-get update
            apt-get install -y --no-install-recommends /dist/stapikkpop_*_amd64.deb xvfb xauth
            export XDG_DATA_HOME=/tmp/data XDG_CONFIG_HOME=/tmp/config XDG_CACHE_HOME=/tmp/cache
            export GSETTINGS_BACKEND=memory NO_AT_BRIDGE=1
            xvfb-run -a stapikkpop --self-test
          '

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: stapik-kpop-${{ needs.version.outputs.value }}-linux-amd64-deb
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ windows, deb ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          pattern: stapik-kpop-*
          merge-multiple: true
          path: dist

      - name: Files of the release
        run: ls -l dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
