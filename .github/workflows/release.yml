name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    uses: Stapik-Group/stapik-common/.github/workflows/build.yml@v1.5.5
    with:
      application-name: stapikkpop
      # cpack needs the file utility to find the dependencies of the package.
      apt-packages: file
      images: '["ubuntu:24.04", "debian:13"]'
      cmake-args: -DSTAPIK_KPOP_BUILD_TESTS=ON -DSTAPIK_WARNINGS_AS_ERRORS=OFF
      package: true
    secrets:
      sign-pfx-base64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
      sign-pfx-password: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}

  publish:
    needs: build
    permissions:
      contents: write
    uses: Stapik-Group/stapik-common/.github/workflows/publish.yml@v1.5.5
